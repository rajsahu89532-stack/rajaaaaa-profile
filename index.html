
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajaaaaa Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .profile {
      width: 90%;
      max-width: 380px;
      text-align: center;
      padding: 35px 20px;
      background: #15151b;
      border-radius: 25px;
    }

    .profile img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #777;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: 25px;
    }

    .username {
      color: #aaa;
      margin-bottom: 25px;
    }

    .instagram {
      display: block;
      text-decoration: none;
      background: #5865f2;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
    }

    .instagram:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <div class="profile">

    <img src="profile.jpg" alt="Profile Photo">

    <h1>Rajaaaaa 👑</h1>

    <div class="username">@rajaaaaa__999</div>

    <a
      class="instagram"
      href="https://www.instagram.com/rajaaaaa__999/"
      target="_blank">
      Open Instagram Profile
    </a>

  </div>

</body>
</html>
